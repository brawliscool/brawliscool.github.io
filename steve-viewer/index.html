<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0d0d0d">
<title>Animated Steve</title>
<script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0c0c0c;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.app{height:100dvh;display:grid;grid-template-rows:auto 1fr auto;background:radial-gradient(circle at 50% 35%,#303030 0,#161616 48%,#0b0b0b 100%)}
header{padding:calc(env(safe-area-inset-top) + 10px) 14px 8px;z-index:4}
h1{margin:0;font-size:18px}.sub{font-size:12px;color:#aaa;margin-top:4px}
.viewer{position:relative;min-height:0}
model-viewer{width:100%;height:100%;background:transparent;touch-action:none;--poster-color:transparent}
.panel{padding:10px 10px calc(env(safe-area-inset-bottom) + 10px);background:linear-gradient(transparent,rgba(0,0,0,.75));display:grid;gap:8px}
.animations{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
button{border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.08);color:#fff;border-radius:13px;min-height:43px;font-weight:650;font-size:12px;backdrop-filter:blur(10px)}
button.active{background:#fff;color:#111}
button:active{transform:scale(.98)}
.badge{position:absolute;top:10px;left:50%;transform:translateX(-50%);padding:7px 11px;border-radius:999px;background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.1);font-size:12px;color:#ccc;pointer-events:none}
#status{position:absolute;inset:0;display:grid;place-items:center;background:#0c0c0c;z-index:6;transition:opacity .3s}
</style>
</head>
<body>
<div class="app">
<header>
<h1>Animated Steve</h1>
<div class="sub">Drag to rotate • pinch to zoom • choose an animation</div>
</header>
<div class="viewer">
<div id="status">Loading Steve…</div>
<div class="badge" id="clipBadge">Idle</div>
<model-viewer id="mv"
 src="./steve_animated.glb"
 camera-controls
 interaction-prompt="none"
 shadow-intensity="1.15"
 shadow-softness=".9"
 exposure="1.05"
 environment-image="neutral"
 camera-orbit="25deg 77deg 52m"
 field-of-view="33deg"
 animation-name="Idle"
 autoplay>
</model-viewer>
</div>
<div class="panel">
<div class="animations">
<button data-anim="Idle" class="active">Idle</button>
<button data-anim="Walk">Walk</button>
<button data-anim="Wave">Wave</button>
<button data-anim="Look Around">Look</button>
</div>
<div class="actions">
<button id="pause">Pause</button>
<button id="reset">Reset View</button>
<button id="full">Fullscreen</button>
</div>
</div>
</div>
<script>
const mv=document.getElementById('mv'),status=document.getElementById('status'),badge=document.getElementById('clipBadge');
const animBtns=[...document.querySelectorAll('[data-anim]')],pause=document.getElementById('pause');
mv.addEventListener('load',()=>{status.style.opacity='0';setTimeout(()=>status.remove(),350);mv.play();});
animBtns.forEach(btn=>btn.onclick=()=>{
  animBtns.forEach(b=>b.classList.remove('active'));btn.classList.add('active');
  mv.animationName=btn.dataset.anim;mv.currentTime=0;mv.play();
  pause.textContent='Pause';badge.textContent=btn.textContent;
});
pause.onclick=()=>{if(mv.paused){mv.play();pause.textContent='Pause'}else{mv.pause();pause.textContent='Play'}};
document.getElementById('reset').onclick=()=>{mv.cameraOrbit='25deg 77deg 52m';mv.fieldOfView='33deg';mv.jumpCameraToGoal()};
document.getElementById('full').onclick=async()=>{try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen?.();else await document.exitFullscreen?.()}catch{}};
</script>
</body>
</html>
