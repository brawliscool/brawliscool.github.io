<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#0d0d0d"><title>Steve 3D Viewer</title><script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0d0d0d;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{position:fixed;inset:0;display:grid;grid-template-rows:auto 1fr auto;background:radial-gradient(circle at 50% 35%,#2c2c2c 0,#151515 52%,#0c0c0c 100%)}header{padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;display:flex;justify-content:space-between;align-items:center;gap:12px;background:linear-gradient(#0009,transparent);z-index:2}h1{font-size:18px;margin:0}.sub{font-size:12px;color:#bbb;margin-top:4px}.viewer{position:relative;min-height:0}model-viewer{width:100%;height:100%;background:transparent;touch-action:none;--poster-color:transparent}.controls{padding:10px 10px calc(env(safe-area-inset-bottom) + 10px);display:grid;grid-template-columns:repeat(4,1fr);gap:8px;background:linear-gradient(transparent,#000b)}button,.pick{border:1px solid #ffffff24;background:#ffffff10;color:#fff;border-radius:14px;min-height:46px;padding:10px 7px;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;text-align:center;backdrop-filter:blur(12px)}button:active,.pick:active{transform:scale(.98);background:#ffffff1c}.pick input{display:none}.tip{position:absolute;top:12px;left:50%;transform:translateX(-50%);padding:7px 11px;border-radius:99px;background:#0008;border:1px solid #ffffff20;font-size:11px;color:#ddd;pointer-events:none;white-space:nowrap}.badge{font-size:11px;border:1px solid #ffffff22;padding:6px 9px;border-radius:999px;background:#ffffff0b}@media(min-width:700px){.controls{max-width:640px;width:100%;margin:auto}}</style></head><body><div class="app"><header><div><h1>Steve 3D Viewer</h1><div class="sub">Drag • pinch to zoom • two-finger pan</div></div><div class="badge">Mobile</div></header><main class="viewer"><div class="tip" id="tip">Drag Steve to rotate</div><model-viewer id="mv" src="./steve.gltf" alt="Minecraft Steve 3D model" camera-controls interaction-prompt="none" shadow-intensity="1.1" shadow-softness=".9" exposure="1.05" environment-image="neutral" camera-orbit="35deg 72deg 52m" field-of-view="34deg"></model-viewer></main><div class="controls"><button id="reset">Reset</button><button id="spin">Auto Rotate</button><button id="front">Front</button><label class="pick">Load GLB<input id="file" type="file" accept=".glb,.gltf,model/gltf-binary,model/gltf+json"></label></div></div><script>const m=document.getElementById('mv'),r=document.getElementById('reset'),s=document.getElementById('spin'),f=document.getElementById('front'),inp=document.getElementById('file'),tip=document.getElementById('tip');let spinning=false,url=null;m.addEventListener('load',()=>setTimeout(()=>tip.style.display='none',2500));r.onclick=()=>{m.cameraOrbit='35deg 72deg 52m';m.fieldOfView='34deg';m.jumpCameraToGoal()};f.onclick=()=>{m.cameraOrbit='0deg 90deg 50m';m.fieldOfView='30deg';m.jumpCameraToGoal()};s.onclick=()=>{spinning=!spinning;m.autoRotate=spinning;s.textContent=spinning?'Stop Rotate':'Auto Rotate'};inp.onchange=e=>{const file=e.target.files[0];if(!file)return;if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(file);m.src=url;tip.textContent='Loaded '+file.name;tip.style.display='block';setTimeout(()=>tip.style.display='none',2200)};</script></body></html>
